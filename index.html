<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11241d">
<meta name="description" content="Magic: The Gathering token tracker">
<title>Token Board TEST</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: playmat felt, header controls, 2-up grid of token cards, sheet for details, fixed turn bar */
:root{
  --felt:#11241d; --felt-2:#183128; --felt-3:#21402f; --line:#2d4c3e;
  --ink:#eee8d8; --muted:#9db3a7; --brass:#d6ab52; --brass-ink:#1e1608; --danger:#e3795c;
  --parch:#f2ecdc; --card-ink:#1c1a16;
  --c-ready:#a9dcbc; --c-tap:#e2c47e; --c-sick:#aec4e2; --c-ctr:#dcb2ea;
  --f-display:"Cinzel",Georgia,"Times New Roman",serif;
  --f-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--felt);color:var(--ink)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 110px;
  background:radial-gradient(120% 80% at 50% 0%,var(--felt-2),var(--felt) 70%) fixed;}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:.04em;color:var(--brass)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--muted);font-size:14px}
.ghost.warn{border-color:var(--danger);color:var(--danger)}
.note{font-size:13px;color:var(--muted)}

/* global modifiers */
.mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mod{background:var(--felt-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:4px;min-width:0}
.mod label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.step{display:flex;align-items:center;justify-content:space-between;gap:4px}
.step button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--felt-3);font-size:18px;line-height:1}
.step output{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:0;text-align:center}
.step output.on{color:var(--brass)}

/* summary */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sum div{padding:8px 6px;text-align:center;background:var(--felt-2);border-right:1px solid var(--line)}
.sum div:last-child{border-right:0}
.sum b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.sum span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sum .hot b{color:var(--brass)}
.atk{background:var(--brass);color:var(--brass-ink);border-radius:10px;padding:10px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.atk b{font-size:22px;font-variant-numeric:tabular-nums}

/* grid of cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media (max-width:380px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.slot{display:grid;gap:6px;min-width:0}
.card{position:relative;aspect-ratio:63/88;max-width:100%;border-radius:4.5%/3.2%;background:#151515;padding:5%;border:0;text-align:left;width:100%;
  box-shadow:0 6px 16px rgba(0,0,0,.45);display:flex}
.frame{flex:1;border-radius:3%;background:var(--fr);display:grid;grid-template-rows:auto 1fr auto auto;gap:3%;padding:4%;min-height:0;color:var(--card-ink)}
.nm{background:var(--parch);border-radius:5px;padding:3px 6px;font-family:var(--f-display);font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.art{border-radius:2px;background:var(--art);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);min-height:0;position:relative;overflow:hidden}
.art .ct{font-family:var(--f-display);font-weight:700;font-size:44px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
.art .ct small{font-size:.5em;opacity:.85}
.tl{background:var(--parch);border-radius:5px;padding:2px 6px;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.tx{background:var(--parch);border-radius:2px;padding:4px 6px 14px;font-size:11px;min-height:34px;opacity:.97}
.tx i{opacity:.55}
.pt{position:absolute;right:6%;bottom:3.5%;background:var(--parch);border:2px solid #151515;border-radius:6px;padding:1px 7px;font-weight:700;font-size:15px;color:var(--card-ink);font-variant-numeric:tabular-nums}
.pt.buffed{background:#fbe6a8}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.ready{color:var(--c-ready);border-color:color-mix(in srgb,var(--c-ready) 50%,transparent)}
.chip.tap{color:var(--c-tap);border-color:color-mix(in srgb,var(--c-tap) 50%,transparent)}
.chip.sick{color:var(--c-sick);border-color:color-mix(in srgb,var(--c-sick) 50%,transparent)}
.chip.ctr{color:var(--c-ctr);border-color:color-mix(in srgb,var(--c-ctr) 50%,transparent)}
.quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.quick button{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--felt-2);font-weight:600;font-size:15px}
.quick .mk{background:var(--felt-3)}
.add{border:1.5px dashed var(--line);border-radius:12px;background:none;color:var(--muted);aspect-ratio:63/88;display:grid;place-items:center;font-size:15px;font-weight:600}
.add span{font-size:36px;display:block;line-height:1;color:var(--brass)}

/* turn bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--felt) 94%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(6px);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--felt-3);font-weight:700;font-size:16px}
.btn.pri{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn:disabled{opacity:.4;cursor:default}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;touch-action:none;overscroll-behavior:contain}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88%;overflow:auto;overscroll-behavior:contain;background:var(--felt-2);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:620px;margin:0 auto;display:grid;gap:14px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh h2{font-family:var(--f-display);font-size:19px;margin:0;color:var(--brass);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.stacks{display:grid;gap:6px}
.stk{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--felt);text-align:left;width:100%}
.stk.sel{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.stk .n{font-size:22px;font-weight:700;min-width:2ch;font-variant-numeric:tabular-nums}
.stk .d{font-size:14px;color:var(--muted)}
.stk .p{font-weight:700;font-variant-numeric:tabular-nums}
.amt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.amt .step{flex:1;max-width:200px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acts .btn{height:44px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.preset{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.preset button{text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--felt);display:flex;justify-content:space-between;gap:6px;align-items:center}
.preset .pip{width:10px;height:10px;border-radius:50%;background:var(--fr);flex:none}
.preset .s{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
form{display:grid;gap:10px}
.f2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fld{display:grid;gap:3px;min-width:0}
.fld span{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;background:var(--felt);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:56px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center;font-size:15px}
.chk input{width:auto}
@media (prefers-reduced-motion:no-preference){.sheet.anim{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.art.ph{box-shadow:inset 0 -46px 36px -24px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.35)}
.search{position:relative}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.thumb{display:flex;gap:10px;align-items:center}
.thumb .pv{width:72px;aspect-ratio:4/3;border-radius:6px;border:1px solid var(--line);background:var(--felt) center/cover no-repeat;flex:none}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pastebox{font-size:14px;border-style:dashed}
.ghost:disabled{opacity:.35;cursor:default}
.mods{grid-template-columns:repeat(2,minmax(0,1fr))}
.topbar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.lifebox{background:var(--felt-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:grid;gap:2px}
.lifebox .step{gap:10px}
.buffbtn{display:grid;gap:2px;align-content:center;text-align:left;background:var(--felt-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.buffbtn .bline{display:flex;align-items:center;gap:8px;min-width:0}
.buffbtn .bsum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--muted)}
.buffbtn .bsum.on{color:var(--brass)}
.buffbtn i{font-style:normal;color:var(--muted);font-size:13px;flex:none}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.arr{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.arr select{width:auto;min-width:0;max-width:100%;padding:6px 8px}
.toolbar{flex-wrap:nowrap}
.toolbar .ghost{flex:none}
.ghost.on{border-color:var(--brass);color:var(--brass);font-weight:600}
.gh{grid-column:1/-1;display:flex;gap:10px;align-items:center;justify-content:space-between;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px 6px;width:100%;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.gh i{font-style:normal;color:var(--brass);font-weight:600;letter-spacing:0;text-transform:none;font-size:13px}
.step .lifetap{width:auto;height:auto;border-radius:0;background:none;border:0;border-bottom:2px dashed var(--line);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 4px;min-width:2.4ch;line-height:1.2}
.lifebig{font-size:64px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.lifebtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lifebtns .btn{height:52px;font-size:20px;font-variant-numeric:tabular-nums}
.lifebtns .btn.down{color:var(--danger)}
.lifebtns .btn.up{color:var(--c-ready)}
.quick.e2{grid-template-columns:1fr 1fr}
.mod.sw2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.switch{display:flex;align-items:center;gap:10px;text-align:left;background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.switch .knob{flex:none;width:38px;height:22px;border-radius:999px;background:var(--felt-3);border:1px solid var(--line);position:relative;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch[aria-checked="true"] .knob{background:var(--brass);border-color:var(--brass)}
.switch[aria-checked="true"] .knob::after{transform:translateX(16px);background:var(--brass-ink)}
.switch span:last-child{display:grid;min-width:0}
.switch b{font-size:14px;line-height:1.2}
.switch.mini{flex:none;padding:5px 9px;gap:7px}.switch.mini b{font-size:13px}
.arr select{flex:1 1 auto;width:0;text-overflow:ellipsis}.toolbar>.ghost{flex:none}
.arr>.sec{display:none}.toolbar .sm{display:none}@media (max-width:440px){.toolbar .lg{display:none}.toolbar .sm{display:inline}}@media (max-width:400px){.toolbar>.ghost{padding-left:9px;padding-right:9px}.switch.mini{padding:5px 7px}}
#lifefx{position:fixed;z-index:200;transform:translate(-50%,-100%);font:800 26px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;pointer-events:none;opacity:0;transition:opacity .35s,margin .35s;margin-top:0;text-shadow:0 2px 6px rgba(0,0,0,.45)}
#lifefx.show{opacity:1;margin-top:-10px}#lifefx.up{color:var(--c-ready)}#lifefx.down{color:var(--danger)}
#lifefx.pop{animation:fxpop .22s ease-out}@keyframes fxpop{from{scale:1.35}to{scale:1}}
.cmdlist{display:grid;gap:8px}.cmdrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.cmdrow input{min-width:0;background:none;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 2px;font-weight:600}
.cmdrow output{font-size:20px;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.cmdrow.lethal{border-color:var(--danger)}.cmdrow.lethal output{color:var(--danger)}.cmdrow small{grid-column:1/-1;color:var(--danger);font-size:12px}
.wipebtns{display:grid;gap:8px}.wipebtns .btn{display:grid;gap:2px;height:auto;padding:12px;text-align:left}.wipebtns small{font-size:12px;opacity:.85}
@media (prefers-reduced-motion:reduce){#lifefx,#lifefx.pop{transition:none;animation:none}}
/* tap feedback */
button,.card{transition:transform .09s ease,filter .09s ease}
.pressing{transform:scale(.95);filter:brightness(1.18)}
.fxf{position:fixed;pointer-events:none;z-index:300;background:var(--brass);opacity:0;animation:fxf .36s ease-out forwards}
.fxf.bad{background:var(--danger)}.fxf.lite{background:#fff}.fxf.soft{animation-duration:.22s}
@keyframes fxf{0%{opacity:.55;transform:scale(.97)}100%{opacity:0;transform:scale(1.06)}}
.fxpop{animation:fxpop .24s ease-out}@keyframes fxpop{0%{transform:scale(.93)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.shake{animation:shake .3s}@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
html.rm button,html.rm .card{transition:filter .09s}html.rm .pressing{transform:none}
html.rm .fxpop{animation:none}html.rm .fxf{animation-name:fxfade}@keyframes fxfade{0%{opacity:.5}100%{opacity:0}}
html.rm .shake{animation:shfade .3s}@keyframes shfade{0%,100%{outline:0}30%,70%{outline:2px solid var(--danger)}}
.makes{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}.makes .btn{height:auto;min-height:48px;padding:6px 4px;display:grid;place-content:center;line-height:1.15}
.makes .btn small{font-size:12px;font-weight:600;opacity:.8}
.feats{display:grid;gap:8px}.feats .sec{margin:6px 0 0}
.topbar.nolife{grid-template-columns:minmax(0,1fr)}
.bar .in.noatk{grid-template-columns:auto 1fr 1fr}
.ctheme{display:grid;gap:6px}.ctheme .row{display:flex;gap:6px}.ctheme .row .ghost{flex:1;padding:4px 8px}
.tegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tef{display:flex;align-items:center;gap:10px;background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px;min-width:0}
.tef input{flex:none;width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.tewarn{display:grid;gap:4px;border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:8px 10px;font-size:13px}
.fld{display:grid;gap:4px}
.phase{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:8px;background:var(--felt-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.phstrip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.phstrip::-webkit-scrollbar{display:none}
.phstrip .ph{flex:none;font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:flex;gap:4px;align-items:center;white-space:nowrap}
.phstrip .ph i{font-style:normal;font-size:10.5px;font-weight:700;background:var(--brass);color:var(--brass-ink);border-radius:999px;padding:0 5px}
.phstrip .ph.cur{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-weight:700}.phstrip .ph.cur i{background:var(--brass-ink);color:var(--brass)}
.phstrip .ph.past{opacity:.5}.phstrip .ph.skip{border-style:dashed;opacity:.55}
.phhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.phhead b{font-family:var(--f-display);font-size:18px;color:var(--brass)}.phhead span{font-size:13px;color:var(--muted)}
.phidle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.chipbtn{border:1px solid var(--brass);color:var(--brass);background:none;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.trigs{display:grid;gap:8px}.trig{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.trig .tt{min-width:0}.trig .tt p{margin:2px 0 0;font-size:13px;color:var(--ink);opacity:.9}.trig em{font-style:normal;font-size:12px;color:var(--c-ready);margin-left:6px}
.trig.skip em{color:var(--muted)}.trig.done,.trig.skip{opacity:.75;padding-block:5px}
.trig .tb{display:grid;gap:6px}.trig .tb .btn{height:34px;font-size:14px;padding:0 12px}
.cond{color:var(--c-tap);font-weight:600}
.nudge{border:1px solid var(--c-tap);color:var(--c-tap);border-radius:10px;padding:8px 10px;font-size:13px}
.perms{display:grid;gap:8px}.permhead{display:flex;gap:8px;align-items:center}.permhead .gh{flex:1}
.permlist{display:grid;gap:6px}.permrow{display:grid;gap:2px;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--felt-2)}
.permrow small{font-size:12px;color:var(--muted)}.permrow.st{position:relative}.permrow .ghost{justify-self:start;margin-top:4px;padding:3px 10px}
.oracle{white-space:pre-wrap;font-size:14px;background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:10px}
.remform{display:grid;grid-template-columns:auto 1fr auto;gap:6px}.remform select,.remform input{min-width:0}
.wipechk{font-size:14px;display:flex;gap:8px;align-items:flex-start}

/* swap a token with its neighbour as shown on screen; returns false at the edge of its group */
function moveTok(id,dir){

/* ---------- phase tracker ----------
   Reads "At the beginning of …" abilities from a permanent's exact Oracle text.
   Old "at end of turn" wording was errata'd to "at the beginning of the end step" (CR 513.1a),
   and untap-step triggers wait for upkeep (CR 502.4), so Untap never has a checklist. */
const PH=[["untap","Untap"],["upkeep","Upkeep"],["draw","Draw"],["main1","Main"],["combat","Combat"],["main2","Main 2"],["end","End step"],["cleanup","Cleanup"]];

function phaseTriggers(text,type){
  const key=(type||"")+"\u0000"+(text||"");if(TRIG_MEMO.has(key))return TRIG_MEMO.get(key);
  const out=[];
  (text||"").split("\n").forEach(ln=>{
    const body=ln.replace(/^[^—\n]{1,40}\s—\s/,"").trim();let m,when,eff;
    if((m=body.match(/^At end of combat( on your turn)?, (.*)$/i))){out.push({ph:"combat",who:m[1]?"you":"each",when:"end of combat"+(m[1]||""),eff:m[2],cond:null});return}
    if(!(m=body.match(/^At the beginning of (.+?), (.*)$/i)))return;
    when=m[1].toLowerCase();eff=m[2];
    let who=/^(your|each of your)\b|on your turn/.test(when)?"you":/opponent/.test(when)?"opp":"each";
    let phs=[];
    if(/upkeep/.test(when))phs=["upkeep"];
    else if(/draw step/.test(when))phs=["draw"];
    else if(/(precombat|first) main/.test(when))phs=["main1"];
    else if(/(postcombat|second) main/.test(when))phs=["main2"];
    else if(/main phase/.test(when))phs=["main1","main2"];
    else if(/combat/.test(when))phs=["combat"];
    else if(/end step/.test(when))phs=["end"];
    else phs=["?"];
    const cond=(eff.match(/^if ([^,]+),/i)||[])[1]||null;if(cond)eff=eff.replace(/^if [^,]+,\s*/i,"");
    for(const ph of phs)out.push({ph,who,when,eff,cond});
  });
  if(/\bSaga\b/.test(type||""))out.push({ph:"main1",who:"you",when:"precombat main phase",eff:"Add a lore counter, then resolve the chapter that triggers.",cond:null,tba:true});
  TRIG_MEMO.set(key,out);return out;
}

function fromScryfall(raw){const c=sfFace(raw),tl=c.type_line||"",emb=/Emblem/.test(tl),cre=!emb&&/Creature/.test(tl),ench=!emb&&/Enchantment/.test(tl),cols=c.colors||raw.colors||[];
  const sub=(tl.split("—")[1]||"").trim();
  return{name:sub||c.name.replace(/ Token$/,""),p:cre?num(c.power):null,t:cre?num(c.toughness):null,
    col:cols.length>1?"M":cols[0]||"C",text:c.oracle_text||"",art:!emb&&(/Artifact/.test(tl)||(!cre&&!ench)),creature:cre,ench,emblem:emb,kw:kwFrom(c.oracle_text),bP:0,bT:0,img:sfImg(raw)}}
function sfShow(html){const el=document.getElementById("sf");if(el)el.innerHTML=html}
function sfSearch(q){
  clearTimeout(SF.timer);SF.ctl?.abort();
  if(q.length<2){SF.items=[];sfShow('<div class="note">Type at least 2 letters to search all official tokens.</div>');return}
  if(!navigator.onLine){sfShow('<div class="note">You\'re offline. Scryfall search needs internet; the library above still works.</div>');return}
  sfShow('<div class="note">Searching Scryfall…</div>');
  SF.timer=setTimeout(async()=>{
    SF.ctl=new AbortController();SF.q=q;
    try{
      const r=await fetch("https://api.scryfall.com/cards/search?unique=cards&order=name&q="+encodeURIComponent(q+" (t:token or t:emblem)"),{signal:SF.ctl.signal,headers:{Accept:"application/json"}});
      if(SF.q!==q)return;
      if(r.status===404){SF.items=[];sfShow('<div class="note">No official tokens match that. Make it as a custom token below.</div>');return}
      if(!r.ok)throw new Error(r.status);
      const j=await r.json();SF.items=(j.data||[]).slice(0,30);
      sfShow(SF.items.map((raw,i)=>{const c=fromScryfall(raw);return `<button class="sfitem" data-a="sfpick" data-i="${i}">
        <span class="sfart" style="background-image:url('${esc(c.img)}')"></span>
        <span class="sfmeta"><b>${esc(c.name)}</b><small>${esc((sfFace(raw).type_line||"").replace(/^Token /,""))}${c.creature?` · ${c.p}/${c.t}`:""}</small>
        <small class="sftext">${esc(c.text||"No abilities")}</small></span></button>`}).join("")+
        `<div class="note">${j.total_cards>30?`Showing 30 of ${j.total_cards}. Add more words to narrow it down. `:""}Card data and images from Scryfall.</div>`);
    }catch(e){if(e.name==="AbortError")return;sfShow('<div class="note">Couldn\'t reach Scryfall right now. Try again in a moment.</div>')}
  },450);
}

/* ---------- decklist import via Scryfall (needs internet) ---------- */
const IMP={busy:false,msg:"",found:[],missing:[],pick:{},name:"",perms:[]};
function parseDecklist(txt){
  const names=new Set();
  for(let ln of txt.split(/\r?\n/)){
    ln=ln.trim();if(!ln||/^(\/\/|#)/.test(ln))continue;
    if(/^(deck|commander|commanders|sideboard|maybeboard|companion|about|name|tokens?)\b:?$/i.test(ln))continue;
    ln=ln.replace(/^SB:\s*/i,"").replace(/^\d+\s*x?\s+/i,"");
    ln=ln.replace(/\s+\*[A-Z]+\*$/,"").replace(/\s+\([A-Za-z0-9]{2,6}\)(\s+[\w★-]+)?\s*$/,"").replace(/\s+\[[^\]]*\]\s*$/,"").trim();
    ln=ln.split(" // ")[0].split(" / ")[0].trim();
    if(ln&&!/^\d+$/.test(ln))names.add(ln);
  }
  return [...names];
}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function sfCollection(ids){
  const out=[],missing=[];
  for(let i=0;i<ids.length;i+=75){
    const r=await fetch("https://api.scryfall.com/cards/collection",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({identifiers:ids.slice(i,i+75)})});
    if(!r.ok)throw new Error("Scryfall "+r.status);
    const j=await r.json();out.push(...(j.data||[]));missing.push(...(j.not_found||[]));
    await pause(120);
  }
  return {cards:out,missing};
}
const tokKey=c=>[c.name,c.p,c.t,c.col,c.text,c.emblem].join("|");
async function runImport(){
  const txt=document.getElementById("imp-text")?.value||"";
  const names=parseDecklist(txt);
  if(!names.length){IMP.msg="Paste a decklist first.";render();return}
  if(!navigator.onLine){IMP.msg="You're offline. Importing needs internet.";render();return}
  IMP.busy=true;IMP.msg=`Looking up ${names.length} cards on Scryfall…`;IMP.found=[];IMP.missing=[];render();
  try{
    const {cards,missing}=await sfCollection(names.map(n=>({name:n})));
    IMP.missing=missing.map(m=>m.name).filter(Boolean);
    IMP.perms=cards.map(permFrom).filter(p=>phaseTriggers(p.text,p.type).length).map(permCopy);
    const src=new Map();
    for(const c of cards)for(const part of (c.all_parts||[])){
      if(part.component!=="token"||part.id===c.id)continue;
      if(!src.has(part.id))src.set(part.id,new Set());src.get(part.id).add(c.name);
    }
    if(!src.size){IMP.busy=false;IMP.msg=`Checked ${cards.length} cards. None of them are linked to tokens on Scryfall.`;render();return}
    IMP.msg=`Found ${src.size} token printings. Getting their details…`;render();
    const {cards:toks}=await sfCollection([...src.keys()].map(id=>({id})));
    const merged=new Map();
    for(const raw of toks){const t=fromScryfall(raw),k=tokKey(t);
      if(!merged.has(k))merged.set(k,{tok:t,from:new Set()});
      for(const n of src.get(raw.id)||[])merged.get(k).from.add(n);}
    IMP.found=[...merged.values()].map(x=>({tok:x.tok,from:[...x.from]})).sort((a,b)=>(a.tok.emblem-b.tok.emblem)||(b.tok.creature-a.tok.creature)||a.tok.name.localeCompare(b.tok.name));
    IMP.pick={};IMP.found.forEach((_,i)=>IMP.pick[i]=true);
    IMP.busy=false;IMP.msg=`${IMP.found.length} different tokens and emblems from ${cards.length} cards.${IMP.perms.length?` ${IMP.perms.length} cards have phase triggers and will be saved with the preset for the phase tracker.`:""}`;
  }catch(e){IMP.busy=false;IMP.msg="Couldn't reach Scryfall right now. Check your connection and try again."}
  render();
}

function applyOp(t,op){
  const s=t.stacks[sheet.sel];if(!s)return;
  const n=Math.min(sheet.amt,s.n);
  if(op==="sac"){sac(t,s,n);sheet.sel=0;sheet.amt=1;logAdd("sac"+t.id,n,"Sacrificed",t.name);return}
  s.n-=n;
  let tgt=null;
  if(op!=="remove"){tgt={...s,n};
    if(op==="tap")tgt.tapped=true;if(op==="untap")tgt.tapped=false;
    if(op==="bonus"){tgt.mp=(tgt.mp||0)+sheet.bp;tgt.mt=(tgt.mt||0)+sheet.bt}if(op==="plus")tgt.c+=1;if(op==="minus")tgt.c-=1;if(op==="dmg"){tgt.d=(tgt.d||0)+sheet.dmg;if(sheet.dt)tgt.dt=true}
    t.stacks.push(tgt);}
  merge(t);
  sheet.sel=tgt?Math.max(0,t.stacks.findIndex(x=>skey(x)===skey(tgt))):0;
  sheet.amt=1;S.example=false;
  log({tap:`Tapped ${n} ${t.name}`,untap:`Untapped ${n} ${t.name}`,plus:`+1/+1 counter on ${n} ${t.name}`,bonus:`${sgn(sheet.bp)}/${sgn(sheet.bt)} bonus on ${n} ${t.name}`,minus:`−1/−1 counter on ${n} ${t.name}`,dmg:`${sheet.dmg}${sheet.dt?" deathtouch":""} damage to ${n} ${t.name}`,remove:`Removed ${n} ${t.name} (exiled, bounced or other)`}[op]);
}

/* actions that only change what's on screen, not the board */
const VIEW=new Set(["padd","popen","ptheirs","tenew","teedit","telight","teframe","tecancel","tesave","tedel","feats","feat","featreset","wipesheet","impopen","impgo","imptog","impall","impnone","lifesheet","grp","buffs","sect","arrange","open","addsheet","close","sel","amt","amtAll","undo","atkopen","atkset","atkmax","atkall","atknone","edit","editback","menu","decks","logsheet","backup","bkcopy","bksave","bkphotos","deckdel","colors","theme","accent","accentreset","dmgamt","dttog","blkopen","bon","ecamt","install"]);
function act(ds,held){
  const a=ds.a,t=S.tokens.find(x=>x.id===ds.id);
  if(!held&&!VIEW.has(a)&&!(a==="reset"&&!pendingReset)&&!(a==="deltype"&&!pendingDel)&&!(a==="bkrestore"&&!pendingRestore))snap();
  if(a!=="reset")pendingReset=false;
  if(a!=="deltype")pendingDel=false;
  if(a!=="deckdel")pendingDeck=null;
  if(a!=="bkrestore")pendingRestore=false;
  if(a!=="tedel")pendingCT=null;
  const tok=()=>S.tokens.find(x=>x.id===sheet?.id);
  switch(a){
    case"mod":{const k=ds.k;S[k]=Math.max(-20,Math.min(30,S[k]+ +ds.v));
      const anth=k[0]==="a";log(`${anth?"Anthem":"Until end of turn"} ${sgn(anth?S.aP:S.eP)}/${sgn(anth?S.aT:S.eT)}`,anth?"anth":"eot");break}
    case"tmod":{const tk=tok();tk[ds.k]=Math.max(-20,Math.min(30,(tk[ds.k]||0)+ +ds.v));log(`${tk.name} type buff ${sgn(tk.bP)}/${sgn(tk.bT)}`,"tb"+tk.id);break}
    case"life":setLife(S.life+ +ds.v);break;
    case"cmd":{const i=+ds.i,v=+ds.v;if(S.cmd[i]+v<0)break;S.cmd[i]+=v;
      setLife(S.life-v,"cmd"+i,e=>{const net=S.cmd[i]-e.c0;return `${S.opp[i]}'s commander: ${net>=0?"+":"−"}${Math.abs(net)} (total ${S.cmd[i]}${S.cmd[i]>=21?", lethal":""}) · `});break}
    case"cmdn":S.cmdN=+ds.v;break;
    case"wipesheet":sheet={kind:"wipe"};break;
    case"wipe":{const ex=ds.v==="exile";let gone=0,kept=0;const parts=[];
      for(const tk of S.tokens){if(!tk.creature||tk.emblem)continue;const n=cnt(tk);if(!n)continue;
        if(!ex&&tk.kw.ind){kept+=n;continue}
        gone+=n;parts.push(`${n} ${tk.name}`);tk.stacks.forEach(st=>{st.n=0});merge(tk)}
      if(F("phase")&&document.getElementById("wipe-perms")?.checked){const go=S.perms.filter(p=>p.cre&&(ex||!p.ind)),stay=S.perms.filter(p=>p.cre&&!ex&&p.ind);
        if(go.length){S.perms=S.perms.filter(p=>!go.includes(p));parts.push(go.map(p=>p.name).join(", "));gone+=go.length}kept+=stay.length}
      if(!ex)S.turn.d+=gone;S.lastAtk=null;sheet=null;
      log(`Board wipe: ${gone?parts.join(", ")+(ex?" exiled":" died"):"no creatures removed"}${kept?` · ${kept} indestructible survived`:""}`);break}
    case"dbl":S.dbl=Math.max(0,Math.min(5,S.dbl+ +ds.v));log(`Doublers ×${mult()}`,"dbl");break;
    case"reset":if(pendingReset){S=fresh(S.start);pendingReset=false;sheet=null}else pendingReset=true;break;
    case"startlife":S.start=+ds.v;break;
    case"undo":if(hist.length){S=hist.pop();if(sheet&&["atk"].includes(sheet.kind))sheet=null}break;
    case"mk1":create(t,1);break;
    case"rm1":{const s=[...t.stacks].reverse().find(x=>x.sick)||[...t.stacks].reverse().find(x=>!x.tapped)||t.stacks[t.stacks.length-1];if(s){s.n--;merge(t);logAdd("rm"+t.id,1,"Removed",t.name)}break}
    case"tap1":{const s=readyOf(t)[0]||t.stacks.find(x=>!x.tapped);if(s){s.n--;t.stacks.push({...s,n:1,tapped:true});merge(t);logAdd("tp"+t.id,1,"Tapped",t.name)}break}
    case"cleandead":{const parts=[];for(const tk of S.tokens){let k=0;for(const s of tk.stacks)if(isDead(tk,s)){k+=s.n;S.turn.d+=s.n;s.n=0}if(k)parts.push(`${k} ${tk.name}`);tk.stacks.forEach(s=>{s.dt=false});merge(tk)}log(`Clean up: ${parts.join(", ")} died`);break}
    case"atkopen":{sheet={kind:"atk",n:{}};for(const tk of S.tokens){const r=readyN(tk);if(r)sheet.n[tk.id]=r}break}
    case"atkset":{const r=readyN(t);sheet.n[t.id]=Math.max(0,Math.min(r,(sheet.n[t.id]||0)+ +ds.v));break}
    case"atkmax":sheet.n[t.id]=readyN(t);break;
    case"atkall":for(const tk of S.tokens)sheet.n[tk.id]=readyN(tk);break;
    case"atknone":sheet.n={};break;

    case"open":sheet={kind:"tok",id:ds.id,sel:0,amt:1,dmg:1,bp:0,bt:0,ec:0};break;

    case"teedit":{const t=CT.find(x=>x.id===ds.v);if(!t)break;sheet={kind:"te",edit:t.id,draft:JSON.parse(JSON.stringify(t))};applyTheme(sheet.draft);break}
    case"telight":sheet.draft.light=ds.v==="1";applyTheme(sheet.draft);break;

    case"tedel":if(pendingCT!==ds.v){pendingCT=ds.v;break}
      CT=CT.filter(x=>x.id!==ds.v);saveCT();pendingCT=null;if(TH.name==="c:"+ds.v){TH={name:"forest",accent:null}}applyTheme();break;

    case"deltype":if(pendingDel){const tk=tok();S.tokens=S.tokens.filter(x=>x.id!==sheet.id);log(`Removed ${tk.name} from the board`);sheet=null;pendingDel=false}else pendingDel=true;break;

    case"deckload":{const d=D.find(x=>x.id===ds.id);if(!d)break;S={...fresh(S.start),tokens:d.tokens.map(newTok),deck:{id:d.id,name:d.name}};log(`Loaded deck ${d.name}`);sheet=null;break}

    case"bkphotos":sheet.photos=document.getElementById("bk-photos").checked;sheet.show=false;sheet.msg="";break;
    case"bkcopy":{const txt=backupJSON(sheet.photos);
      if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>{sheet.msg=`Copied ${Math.round(txt.length/1024)} KB. Paste it into a note or email to yourself.`;sheet.show=false;render()},()=>{sheet.show=true;sheet.msg="Copy was blocked. Select all the text below and copy it.";render()})}
      else{sheet.show=true;sheet.msg="Select all the text below and copy it."}

      DL.save({filename:`token-board-backup-${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}.json`,data:txt})
        .then(()=>{sheet.msg="Backup saved to your Downloads folder.";render()})
        .catch(err=>{sheet.msg=err?.code==="declined"?"Save cancelled.":"Saving a file isn't available here. Use Copy backup text instead.";if(err?.code&&err.code!=="declined"&&err.code!=="rate_limited")DL=null;render()});
      break}
    case"bkrestore":{
      if(!pendingRestore){const raw=document.getElementById("bk-in").value.trim();if(!raw){sheet.err="Paste backup text or open a backup file first.";break}sheet.err="";pendingRestore=true;break}
      pendingRestore=false;
      try{const o=JSON.parse(document.getElementById("bk-in").value.trim());
        if(o.app!=="tokenboard"||!o.board||!Array.isArray(o.board.tokens))throw 0;
        S=norm(o.board);D=Array.isArray(o.decks)?o.decks:[];if(Array.isArray(o.themes)){for(const t of o.themes)if(t&&t.id&&t.v&&!CT.some(x=>x.id===t.id))CT.push(t);saveCT()}if(o.theme&&themeOf(o.theme.name)){TH={name:o.theme.name,accent:o.theme.accent||null};applyTheme()}log("Restored from backup");sheet=null;
      }catch(e){hist.pop();sheet.err="That text isn't a Token Board backup. Make sure you copied all of it."}
      break}
    default:return false;
  }
  return true;
}
/* Button feedback. Every tap redraws the screen, which replaces the button that was pressed,
   so the flash is drawn as an overlay where the button was and the new copy gets a small pop. */
const BAD_A=new Set(["wipe","rm1","sac1","deltype","deckdel","reset"]);
const isBad=b=>BAD_A.has(b.dataset.a)||["sac","remove"].includes(b.dataset.op)||b.classList.contains("warnbtn")||b.classList.contains("warn");

const buzz=ms=>{if(UI.f.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}};
function fxAt(rect,radius,kind,soft){if(!rect||!rect.width)return;const o=document.createElement("div");o.className="fxf "+kind+(soft?" soft":"");
  Object.assign(o.style,{left:rect.left+"px",top:rect.top+"px",width:rect.width+"px",height:rect.height+"px",borderRadius:radius});
  document.body.appendChild(o);setTimeout(()=>o.remove(),450)}
function twin(ds,rect){const keys=Object.keys(ds).filter(k=>k!=="rep");let best=null,bd=1e9;
  document.querySelectorAll(`[data-a="${ds.a}"]`).forEach(el=>{if(!keys.every(k=>el.dataset[k]===ds[k]))return;const r=el.getBoundingClientRect(),d=Math.abs(r.left-rect.left)+Math.abs(r.top-rect.top);if(d<bd){bd=d;best=el}});return best}
function feedback(b,soft){const rect=b.getBoundingClientRect(),radius=getComputedStyle(b).borderRadius,kind=isBad(b)?"bad":b.classList.contains("pri")?"lite":"acc",ds={...b.dataset};
  buzz(soft?6:12);
  setTimeout(()=>{fxAt(rect,radius,kind,soft);const n=ds.a?twin(ds,rect):(b.isConnected?b:null);if(n){n.classList.remove("fxpop");void n.offsetWidth;n.classList.add("fxpop");setTimeout(()=>n.classList.remove("fxpop"),260)}},0)}

  pressEl=b;b.classList.add("pressing")},true);

document.addEventListener("click",e=>{const b=e.target.closest("button,.card");if(!b||b.disabled||swallow)return;feedback(b)},true);

  if(id==="impf"){const name=document.getElementById("imp-name").value.trim();
    const toks=IMP.found.filter((_,i)=>IMP.pick[i]).map(f=>typeOf({...f.tok}));if(!name||!toks.length)return;
    const ex=D.find(d=>d.name.toLowerCase()===name.toLowerCase());const deck={id:ex?.id||nid(),name,tokens:toks,perms:IMP.perms||ex?.perms||[]};
    if(ex)D[D.indexOf(ex)]=deck;else D.push(deck);
    IMP.found=[];IMP.pick={};IMP.msg=`Saved "${name}" with ${toks.length} tokens. Load it from Deck presets.`;
    sheet={kind:"decks"};render();return}
  if(id==="df"){const name=document.getElementById("deck-name").value.trim();if(!name||!S.tokens.length)return;
    const ex=D.find(d=>d.name.toLowerCase()===name.toLowerCase());
    const deck={id:ex?.id||nid(),name,tokens:S.tokens.map(typeOf),perms:S.perms.length?S.perms.map(permCopy):(ex?.perms||[])};S.deck={id:deck.id,name};
    if(ex)D[D.indexOf(ex)]=deck;else D.push(deck);
    document.getElementById("deck-name").value="";render();return}
  if(id==="lf"){const el=document.getElementById("life-in"),n=parseInt(el.value,10);if(!Number.isFinite(n))return;
    snap();setLife(n,"lifeset");el.value="";el.blur();render();return}
  if(id!=="cf"&&id!=="ef")return;
  snap();
  const d=readForm(id);
  if(id==="cf"){
    const t={id:nid(),...d,bP:0,bT:0,stacks:[],img:pendingImg};pendingImg=null;
    S.tokens.push(t);S.example=false;sheet={kind:"tok",id:t.id,sel:0,amt:1,dmg:1,bp:0,bt:0,ec:0};log(`Added ${t.name} to the board`);
  }else{
    const t=S.tokens.find(x=>x.id===sheet.id);if(!t)return;
    Object.assign(t,d);if(!t.creature)t.stacks.forEach(s=>{s.c=0;s.sick=false});if(t.emblem)t.stacks.forEach(s=>{s.tapped=false;s.d=0});merge(t);
    log(`Edited ${t.name}`);sheet={kind:"tok",id:t.id,sel:0,amt:1,dmg:1,bp:0,bt:0,ec:0};
  }
  pendingDel=false;render();
});

  const t=S.tokens.find(x=>x.id===sheet?.id);if(!t)return;snap();t.img=url;render();
}

  const on=el.id.match(/^opn-(\d)$/);if(on){const v=el.value.trim().slice(0,18);if(v&&v!==S.opp[+on[1]]){snap();S.opp[+on[1]]=v;render()}return}
